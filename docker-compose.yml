services:
  postgres:
    image: postgres:16-alpine
    # 5433 on the host: 5432 is usually taken by a native Postgres install.
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=peace_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peace_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage so uploads and playback work with no AWS account.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket and allow browser PUT/GET via presigned URLs.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/peace-videos &&
      mc anonymous set none local/peace-videos &&
      echo 'MinIO bucket peace-videos ready'
      "

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    ports:
      - "3001:3001"
    environment:
      # Talk to the compose services by service name, not host.docker.internal.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/peace_dev
      - ML_BACKEND_URL=http://ml-backend:8000
      - ML_BACKEND_PUBLIC_URL=http://localhost:8001
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=peace-analyzer-dev-secret-change-in-production
      - AUTH_TRUST_HOST=true
      # Presigned URLs are redeemed by the browser, so the endpoint must be the
      # host-visible one, not http://minio:9000.
      - S3_ENDPOINT=http://localhost:9000
      - S3_BUCKET_NAME=peace-videos
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./hooks:/app/hooks
      - ./lib:/app/lib
      - ./public:/app/public
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      ml-backend:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  ml-backend:
    build:
      context: ./ml-backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8001:8000"
    environment:
      - PEACE_USE_MOCK_MODELS=false
      - PEACE_MODEL_PATH=/app/app/models/best_model.pt
      - PEACE_DEBUG=true
      - PEACE_CORS_ORIGINS=["http://localhost:3001"]
      - PEACE_JOB_DB_PATH=/app/data/jobs.db
      - PEACE_UPLOAD_DIR=/app/data/uploads
      # The backend downloads from MinIO over the compose network.
      - PEACE_S3_ENDPOINT=http://minio:9000
      - PEACE_S3_BUCKET=peace-videos
      - PEACE_S3_REGION=us-east-1
      - PEACE_AWS_ACCESS_KEY_ID=minioadmin
      - PEACE_AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./ml-backend/app:/app/app
      - ./.docker-data/ml:/app/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
