services:
  # S3-compatible storage so uploads and playback work with no AWS account.
  # RustFS stands in for MinIO, whose images were withdrawn from Docker Hub
  # and quay.io in September 2026. Same ports, same credentials, console on
  # 9001.
  s3:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      # The browser PUTs straight to the bucket with a presigned URL, so the
      # S3 API must answer CORS preflights.
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket if it is missing.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket peace-videos 2>/dev/null ||
      aws --endpoint-url http://s3:9000 s3 mb s3://peace-videos &&
      echo 'Bucket peace-videos ready'
      "

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    ports:
      - "3001:3001"
    environment:
      # SQLite file on the bind mount below, so it survives a rebuild.
      - DATABASE_URL=file:/app/data/dev.db
      # Talk to the compose services by service name, not host.docker.internal.
      - ML_BACKEND_URL=http://ml-backend:8000
      - ML_BACKEND_PUBLIC_URL=http://localhost:8001
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=peace-analyzer-dev-secret-change-in-production
      - AUTH_TRUST_HOST=true
      # Presigned URLs are redeemed by the browser, so the endpoint must be the
      # host-visible one, not http://s3:9000.
      - S3_ENDPOINT=http://localhost:9000
      - S3_BUCKET_NAME=peace-videos
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./app:/app/app
      - ./components:/app/components
      - ./hooks:/app/hooks
      - ./lib:/app/lib
      - ./public:/app/public
      - ./prisma:/app/prisma
      - ./.docker-data/web:/app/data
    depends_on:
      ml-backend:
        condition: service_started
      s3-init:
        condition: service_completed_successfully

  ml-backend:
    build:
      context: ./ml-backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8001:8000"
    environment:
      - PEACE_USE_MOCK_MODELS=false
      - PEACE_MODEL_PATH=/app/app/models/best_model.pt
      - PEACE_DEBUG=true
      - PEACE_CORS_ORIGINS=["http://localhost:3001"]
      - PEACE_JOB_DB_PATH=/app/data/jobs.db
      - PEACE_UPLOAD_DIR=/app/data/uploads
      # The backend downloads from the bucket over the compose network.
      - PEACE_S3_ENDPOINT=http://s3:9000
      - PEACE_S3_BUCKET=peace-videos
      - PEACE_S3_REGION=us-east-1
      - PEACE_AWS_ACCESS_KEY_ID=minioadmin
      - PEACE_AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./ml-backend/app:/app/app
      - ./.docker-data/ml:/app/data
    depends_on:
      s3-init:
        condition: service_completed_successfully

volumes:
  s3data:
