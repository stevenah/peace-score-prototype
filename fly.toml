app = 'peace-frontend'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.frontend'
  target = 'prod'

[deploy]
  # Once per deploy, in a temporary machine, before the new version takes
  # traffic. Not on every wake from zero.
  release_command = 'sh -c "node_modules/.bin/prisma migrate deploy && node prisma/seed-deploy.js"'

[env]
  AUTH_TRUST_HOST = 'true'
  NEXT_TELEMETRY_DISABLED = '1'
  # Server-side calls and the browser's live WebSocket both use the public
  # hostname: it is the only address that wakes a stopped machine.
  ML_BACKEND_URL = 'https://peace-ml.fly.dev'
  ML_BACKEND_PUBLIC_URL = 'https://peace-ml.fly.dev'
  AWS_REGION = 'us-east-1'
  # Secrets, set with `fly secrets set`: DATABASE_URL, NEXTAUTH_SECRET,
  # ML_API_KEY (same value as PEACE_API_KEY on peace-ml), SEED_ADMIN_PASSWORD,
  # S3_BUCKET_NAME, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/login'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
