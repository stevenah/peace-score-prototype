app = 'peace-frontend'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.frontend'
  target = 'prod'

[env]
  AUTH_TRUST_HOST = 'true'
  NEXT_TELEMETRY_DISABLED = '1'
  NEXT_PUBLIC_WS_URL = 'wss://peace-ml.fly.dev/api/v1/ws/live'
  ML_BACKEND_URL = 'https://peace-ml.fly.dev'
  NEXT_PUBLIC_ML_BACKEND_URL = 'https://peace-ml.fly.dev'
  AWS_REGION = 'us-east-1'
  # S3 secrets must be set via: fly secrets set S3_BUCKET_NAME=... AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=...

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
