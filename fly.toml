app = 'peace-frontend'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile.frontend'
  target = 'prod'

[env]
  AUTH_TRUST_HOST = 'true'
  NEXT_TELEMETRY_DISABLED = '1'
  # SQLite on the volume below. Migrations and the admin seed run at boot
  # (Dockerfile.frontend CMD), because a release command would run in a
  # machine without the volume.
  DATABASE_URL = 'file:/data/peace.db'
  # Server-side calls and the browser's live WebSocket both use the public
  # hostname: it is the only address that wakes a stopped machine.
  ML_BACKEND_URL = 'https://peace-ml.fly.dev'
  ML_BACKEND_PUBLIC_URL = 'https://peace-ml.fly.dev'
  AWS_REGION = 'us-east-1'
  # Secrets, set with `fly secrets set`: NEXTAUTH_SECRET, ML_API_KEY (same
  # value as PEACE_API_KEY on peace-ml), SEED_ADMIN_PASSWORD, S3_BUCKET_NAME,
  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY. Optional: ML_BACKEND_GPU_URL,
  # the GPU box on the private network, tried before ML_BACKEND_URL (README,
  # "Using the GPU box for compute").

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Boot runs the migrations and seed first, hence the grace period.
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/login'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# One machine owns the database file. The deploy workflow passes --ha=false so
# Fly never adds a second one.
[mounts]
  source = 'peace_web_data'
  destination = '/data'
  initial_size = '1gb'
