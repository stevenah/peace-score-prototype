name: Test

# Runs on pull requests and on direct pushes to non-main branches. The deploy
# workflows also call it before shipping, each for its own half, so main never
# deploys untested code.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      only:
        description: "Run one job only: 'web' or 'ml'. Empty runs both."
        type: string
        default: ""

jobs:
  frontend:
    name: Frontend (vitest + tsc)
    if: ${{ !inputs.only || inputs.only == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 needs Node >= 22.13. Keep in step with Dockerfile.frontend.
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: pnpm test
      - run: pnpm exec tsc --noEmit

  ml-backend:
    name: ML backend (pytest)
    if: ${{ !inputs.only || inputs.only == 'ml' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # CPU wheels, same pins as uv.lock and the production image. The default
      # PyPI linux wheel drags in ~3 GB of CUDA libraries the tests never use.
      - run: uv venv
      - run: uv pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.10.*" "torchvision==0.25.*"
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest -m "not slow" -q
