[project]
name = "peace-ml-backend"
version = "0.1.0"
description = "ML backend for PEACE endoscopy video analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "torchvision>=0.15",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
]
# Landmark training/evaluation tooling (ml-backend/training/landmarks). Never
# installed in the production image, which uses ".[ml]" only.
train = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "timm>=1.0",
    "imagehash>=4.3",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
include = ["app*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: needs real data, model weights or training extras (deselect with -m 'not slow')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
