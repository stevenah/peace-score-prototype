app = 'peace-ml'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'
  target = 'prod'

[env]
  PEACE_USE_MOCK_MODELS = 'false'
  PEACE_MODEL_PATH = '/app/app/models/best_model.pt'
  PEACE_DEBUG = 'false'
  PEACE_DEVICE = 'cpu'
  PEACE_UPLOAD_DIR = '/data/uploads'
  PEACE_JOB_DB_PATH = '/data/jobs.db'
  PEACE_S3_REGION = 'us-east-1'
  # ESGE landmark stations: off until the bundle passes its gates; then
  # ENABLED='true' with DISPLAY='false' for the shadow study.
  PEACE_LANDMARKS_ENABLED = 'false'
  PEACE_LANDMARKS_DISPLAY = 'false'
  # The admin page's Models tab is read-only here: no switching, no evals.
  PEACE_MODEL_ADMIN = 'false'
  PEACE_TORCH_THREADS = '2'
  # Secrets, set with `fly secrets set`: PEACE_API_KEY (same value as ML_API_KEY
  # on peace-frontend), PEACE_S3_BUCKET, PEACE_AWS_ACCESS_KEY_ID,
  # PEACE_AWS_SECRET_ACCESS_KEY

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # The port only opens after model warm-up, hence the long grace period.
  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2

[mounts]
  source = 'peace_ml_data'
  destination = '/data'
  initial_size = '10gb'
